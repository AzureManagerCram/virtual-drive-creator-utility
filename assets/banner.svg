<svg viewBox="0 0 1200 360" width="1200" height="360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1c"/>
      <stop offset="55%" stop-color="#101a33"/>
      <stop offset="100%" stop-color="#0d1428"/>
    </linearGradient>
    <linearGradient id="disk1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3ee6e0"/>
      <stop offset="100%" stop-color="#2678d6"/>
    </linearGradient>
    <linearGradient id="disk2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a6bff"/>
      <stop offset="100%" stop-color="#3f3fb0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3ee6e0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3ee6e0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8a6bff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8a6bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#bfeaff"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="360" fill="url(#bg)"/>

  <!-- ambient glows -->
  <circle cx="960" cy="120" r="220" fill="url(#glow)"/>
  <circle cx="1040" cy="260" r="180" fill="url(#glowPurple)"/>

  <!-- faint grid backdrop -->
  <g stroke="#2a3b5c" stroke-width="1" opacity="0.25">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
  </g>

  <!-- cloud source shape, top right -->
  <g opacity="0.85">
    <path d="M840 78 q-18 -30 12 -42 q10 -26 40 -20 q14 -22 40 -8 q28 -6 30 20 q22 4 16 26 q10 20 -12 26 l-118 6 q-16 -2 -8 -8 z" fill="#1b2745" stroke="#3ee6e0" stroke-width="1.5" opacity="0.7"/>
  </g>

  <!-- connecting stream lines from cloud/folder to drive -->
  <path d="M870 100 C 920 130, 950 150, 990 168" stroke="#3ee6e0" stroke-width="2" fill="none" opacity="0.5"/>
  <path d="M760 70 C 850 110, 900 140, 990 172" stroke="#8a6bff" stroke-width="2" fill="none" opacity="0.4"/>

  <!-- folder icon -->
  <g transform="translate(700,40)" opacity="0.9">
    <path d="M0 20 h34 l10 14 h46 a6 6 0 0 1 6 6 v40 a6 6 0 0 1 -6 6 h-90 a6 6 0 0 1 -6 -6 v-54 a6 6 0 0 1 6 -6 z" fill="#16213f" stroke="#8a6bff" stroke-width="2"/>
  </g>

  <!-- stack of virtual drive platters -->
  <g transform="translate(1000,190)">
    <ellipse cx="0" cy="60" rx="120" ry="34" fill="none" stroke="#2a3b5c" stroke-width="2" opacity="0.5"/>
    <ellipse cx="0" cy="30" rx="120" ry="34" fill="#101a33" stroke="url(#disk2)" stroke-width="3"/>
    <ellipse cx="0" cy="30" rx="60" ry="17" fill="none" stroke="#8a6bff" stroke-width="1.5" opacity="0.6"/>
    <circle cx="0" cy="30" r="6" fill="#8a6bff"/>

    <ellipse cx="0" cy="-10" rx="120" ry="34" fill="#0f1a30" stroke="url(#disk1)" stroke-width="3"/>
    <ellipse cx="0" cy="-10" rx="60" ry="17" fill="none" stroke="#3ee6e0" stroke-width="1.5" opacity="0.7"/>
    <circle cx="0" cy="-10" r="6" fill="#3ee6e0"/>

    <ellipse cx="0" cy="-48" rx="120" ry="34" fill="#0c1526" stroke="url(#disk1)" stroke-width="3"/>
    <ellipse cx="0" cy="-48" rx="60" ry="17" fill="none" stroke="#3ee6e0" stroke-width="1.5" opacity="0.85"/>
    <circle cx="0" cy="-48" r="6" fill="#3ee6e0"/>

    <!-- rim highlight ring -->
    <ellipse cx="0" cy="-48" rx="120" ry="34" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.15"/>
  </g>

  <!-- small floating data blocks -->
  <g fill="none" stroke="#3ee6e0" stroke-width="1.6" opacity="0.55">
    <rect x="860" y="230" width="18" height="18" rx="3"/>
    <rect x="900" y="270" width="14" height="14" rx="3"/>
    <rect x="820" y="200" width="12" height="12" rx="3"/>
  </g>

  <!-- headline -->
  <text x="60" y="150" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="72" fill="url(#titleGrad)" textLength="760" lengthAdjust="spacingAndGlyphs">Virtual Drive Creator</text>

  <!-- tagline -->
  <text x="60" y="205" font-family="'Segoe UI', Arial, sans-serif" font-weight="400" font-size="24" fill="#a9c4e0" textLength="760" lengthAdjust="spacingAndGlyphs">Create and manage virtual drives from disk images,</text>
  <text x="60" y="238" font-family="'Segoe UI', Arial, sans-serif" font-weight="400" font-size="24" fill="#a9c4e0" textLength="520" lengthAdjust="spacingAndGlyphs">folders, or cloud storage instantly.</text>

  <!-- decorative underline accent -->
  <rect x="60" y="260" width="140" height="4" rx="2" fill="url(#disk1)"/>
</svg>